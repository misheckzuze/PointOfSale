name: Verify Point of Sale
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Verify packaged runtime
        shell: powershell
        run: |
          $jars = @(Get-ChildItem target -Filter '*.jar' -File | Where-Object { $_.Name -notmatch '^original-|-(sources|javadoc|tests|shaded)\.jar$' })
          if ($jars.Count -ne 1) { throw 'Expected exactly one packaged application JAR.' }
          java -jar $jars[0].FullName --verify-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime verification failed.' }
          "POS_JAR=$($jars[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify updater syntax
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/Start-POS.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Test Git updater with a local repository
        shell: powershell
        run: ./scripts/Test-GitUpdater.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PointOfSale-${{ github.sha }}
          path: |
            ${{ env.POS_JAR }}
            scripts/Start-POS.ps1
            README.md
          if-no-files-found: error
